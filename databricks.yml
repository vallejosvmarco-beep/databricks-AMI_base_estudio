bundle:
  name: databricks_ami_base

include:
  - resources/*.yml
  - resources/pipelines/*.yml
  - resources/jobs/*.yml
  - databricks.local*.yml


variables:

  # ============================================================
  # VARIABLE DE CATALOGO - CRUCIAL PARA PORTABILIDAD
  # ============================================================
  # IMPORTANTE: El catalogo 'workspace' NO EXISTE en todos los entornos.
  # 
  # MIGRACION ENTRE WORKSPACES:
  #
  # 1. PRIMERA VEZ EN UN NUEVO WORKSPACE:
  #    a) Lista catalogos disponibles:
  #       databricks catalogs list
  #    
  #    b) Crea databricks.local.yml (ignorado por git):
  #       cp databricks.local.yml.example databricks.local.yml
  #    
  #    c) Edita databricks.local.yml y cambia el catalogo:
  #       variables:
  #         catalog:
  #           default: main  # O el nombre de tu catalogo
  #    
  #    d) Deploy:
  #       databricks bundle deploy --target free_dev
  #
  # 2. DEPLOY TEMPORAL (sin crear databricks.local.yml):
  #    databricks bundle deploy --var catalog=main --target free_dev
  #
  # 3. COMPORTAMIENTO DEL BOOTSTRAP:
  #    - El script bootstrap.py verificara si el catalogo existe
  #    - Si NO existe, intentara crearlo (requiere permisos)
  #    - Si falla, mostrara catalogos disponibles y detendra el deploy
  #    - Esto previene deploys parciales que fallan a mitad de camino
  #
  # 4. NUNCA CAMBIES ESTE VALOR POR DEFECTO:
  #    - Mantener 'workspace' como default es intencional
  #    - Fuerza a cada desarrollador a configurar explicitamente su entorno
  #    - Evita commits accidentales con catalogos personales
  # ============================================================
  catalog:
    default: workspace

  schema_alunizaje:
    default: alunizaje

  schema_bronce:
    default: bronce

  schema_plata:
    default: plata

  schema_analisis:
    default: plata_analisis

  volume_oficiales:
    default: datos_oficiales

  oficial_periodo:
    default: "2026"

  oficial_mes:
    default: "06"

  # Periodo evaluado en plata_analisis / plata_950.
  # "auto" = misma ventana que el bronce carga (primer dia del primer mes .. ultimo dia del ultimo mes).
  # Tambien acepta fechas fijas "yyyy-MM-dd".
  periodo_inicio:
    default: auto

  periodo_fin:
    default: auto

  # ============================================================
  # FUENTES AMI (parquet en el volumen de alunizaje)
  # ============================================================
  # Estructura esperada por fuente:
  #   <ami_base_path>/<fuente>/source=<AMI|PME>/format=PARQUET/periodo=<yyyy>/mes=<m>/[r1|r2/]*.parquet
  # Fuentes: carga, consumo, tension (source=AMI) y PME (source=PME).
  # Bronce = streaming tables con Auto Loader (solo lee archivos nuevos), un flujo por mes.
  # La ventana se calcula en src/ami_base/utilities/ventana.py listando el landing; solo
  # cuentan los meses con parquet en las 4 fuentes. La tarea retencion_bronce borra del
  # bronce los meses que salen de la ventana. Plata incluye toda la masa de clientes.
  ami_base_path:
    description: Carpeta raiz de los parquet AMI/PME en el volumen de alunizaje
    default: /Volumes/datosami/datos/vol_alunizaje/ami

  # Ultimo mes de la ventana. "ultimo" = ultimo mes disponible en el landing (se detecta
  # en cada corrida). Para fijarlo: ami_periodo "2025" y ami_mes "12" (o "1"/"01").
  ami_periodo:
    default: ultimo

  ami_mes:
    default: ultimo

  # Meses de historial hacia atras desde el ultimo mes (incluido).
  # "1" = solo el ultimo mes; "N" = N meses; "todos" = todos los meses disponibles.
  ami_meses_historial:
    default: "1"

scripts:

  bootstrap:

    env:
      BUNDLE_TARGET: ${bundle.target}
      CATALOG: ${var.catalog}

    content: |
      echo "Bootstrap target: $BUNDLE_TARGET"
      echo "Catalogo: $CATALOG"
      python3 scripts/bootstrap.py "$CATALOG"


targets:

  free_dev:

    mode: development
    default: true

    variables:

      # Entorno CNFL: catalogo datosami, esquema unico datos
      catalog: datosami
      schema_alunizaje: datos
      schema_bronce: datos
      schema_plata: datos
      schema_analisis: datos

      # Excel oficiales TMT/TMTB: /Volumes/datosami/datos/datos_oficiales/{tmt|tmtb}/<periodo>/<mes>
      volume_oficiales: datos_oficiales

      # Fase 1: solo el ultimo mes disponible en vol_alunizaje (toda la masa de clientes).
      # Fase 2: ami_meses_historial: todos  (sube todos los meses del landing).
      # El unico snapshot oficial disponible es junio 2026; se usa para la columna PLAN (TMT/TMTB).
      ami_base_path: /Volumes/datosami/datos/vol_alunizaje/ami
      ami_periodo: ultimo
      ami_mes: ultimo
      ami_meses_historial: "1"
      oficial_periodo: "2026"
      oficial_mes: "06"
      periodo_inicio: auto
      periodo_fin: auto
