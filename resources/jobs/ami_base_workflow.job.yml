resources:
  jobs:
    ami_base_workflow:
      name: AMI_base_Workflow
      queue:
        enabled: true

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        # ============================================================
        # Sin tarea de retencion: AMI_base es incremental y no borra meses del bronce.
        # (src/ami_base/mantenimiento/retencion_bronce.py queda disponible para cortes
        # futuros, pero no se ejecuta en el job.)
        # Ademas, un mes borrado no se vuelve a ingerir con el mismo flujo: el nombre del
        # flujo identifica su checkpoint de streaming.
        # ============================================================

        # ============================================================
        # TAREA 1: Landing -> bronce -> plata (pipeline AMI_base, incremental)
        # ============================================================
        - task_key: actualizar_incremental
          pipeline_task:
            pipeline_id: ${resources.pipelines.ami_base.id}

        # ============================================================
        # TAREA 2: Calidad de datos -> plata_950_carga (pipeline AMI_base_Analisis)
        # ============================================================
        - task_key: recalcular_analisis
          depends_on:
            - task_key: actualizar_incremental
          pipeline_task:
            pipeline_id: ${resources.pipelines.ami_base_analisis.id}
